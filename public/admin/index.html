<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Edit site — Pratham Agarwal</title>
    <!-- Absolute path, so it loads whether the address is /admin or /admin/ -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!-- Decap CMS: forms for adding and editing everything under /content. -->
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Log in through this site's own /api/auth (see /api), whatever domain it's on.
      // Everything else comes from config.yml.
      CMS.init({
        config: {
          backend: { base_url: window.location.origin, auth_endpoint: 'api/auth' },
        },
      });
    </script>
  </body>
</html>
