# Sveltia CMS: the editor at /admin. Every save becomes a commit to the repo,
# and Vercel rebuilds the site from it. Sign in with a GitHub access token.
backend:
  name: github
  repo: PrathamAgarwal1/Portfolio
  branch: main

media_folder: public/media
public_folder: /media

collections:
  - name: sections
    label: Home page sections
    label_singular: Section
    folder: content/sections
    create: true
    slug: "{{slug}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    description: "Every heading on the home page. Add a new one, rename, reorder or hide any of them."
    fields:
      - { name: title, label: Heading, widget: string }
      - name: type
        label: Type
        widget: select
        default: custom
        options: [custom, projects, videos, finds, about, contact]
        hint: "Keep 'custom' for a new section. The others show your projects, videos, finds, about or contact."
      - { name: order, label: Order, widget: number, value_type: int, default: 10, hint: "Lower numbers appear higher on the page" }
      - { name: visible, label: Show on the site, widget: boolean, default: true }
      - { name: note, label: Small note next to the heading, widget: string, required: false }
      - { name: intro, label: Intro line, widget: text, required: false, hint: "Custom sections only" }
      - name: layout
        label: Layout
        widget: select
        default: cards
        options: [cards, list, text]
        hint: "Custom sections only. Cards: a grid. List: one entry per row (good for experience or reading). Text: just the writing below."
      - name: items
        label: Entries
        label_singular: Entry
        widget: list
        required: false
        hint: "Custom sections only"
        fields:
          - { name: title, label: Title, widget: string }
          - { name: label, label: Small label, widget: string, required: false, hint: "e.g. paper, internship, book" }
          - { name: date, label: Date, widget: datetime, required: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
          - { name: text, label: Text, widget: text, required: false }
          - { name: link, label: Link, widget: string, required: false }
          - { name: image, label: Image, widget: image, required: false }
      - { name: body, label: Writing, widget: markdown, required: false, modes: [rich_text, raw], hint: "Custom sections only. Shown above any entries. Equations: $...$ inline or $$...$$ on their own lines (Markdown mode)." }

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    create: true
    slug: "{{slug}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: tag, label: Tag, widget: string, hint: "Small label above the title, e.g. computer vision" }
      - { name: summary, label: Summary, widget: text, hint: "One or two sentences shown on the home page" }
      - { name: order, label: Order, widget: number, value_type: int, default: 10, hint: "Lower numbers appear first" }
      - { name: featured, label: Featured, widget: boolean, default: false, hint: "Show this one large at the top (only one at a time)" }
      - { name: image, label: Image, widget: image, required: false }
      - name: stats
        label: Stats
        widget: list
        required: false
        fields:
          - { name: value, label: Number, widget: string }
          - { name: label, label: What it means, widget: string }
      - name: links
        label: Links
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL, widget: string }
      - { name: body, label: Full write-up, widget: markdown, required: false, modes: [rich_text, raw], hint: "Equations: $...$ inline or $$...$$ on their own lines. Switch to Markdown mode to type them." }

  - name: videos
    label: Videos
    label_singular: Video
    folder: content/videos
    create: true
    slug: "{{slug}}"
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: youtubeId, label: YouTube video ID, widget: string, required: false, hint: "The part after watch?v= in the video's link" }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: duration, label: Length, widget: string, required: false, hint: "e.g. 12 min" }
      - { name: summary, label: Summary, widget: text, required: false }
      - { name: thumbnail, label: Custom thumbnail, widget: image, required: false, hint: "Leave empty to use the YouTube thumbnail" }
      - { name: draft, label: Draft (hidden on the live site), widget: boolean, default: false }
      - name: body
        label: Written version
        widget: markdown
        required: false
        modes: [raw, rich_text]
        hint: "Equations: $E = mc^2$ inside a sentence, or $$ on its own line, the equation, then $$ again for a centred one. Write equations in Markdown mode."

  - name: finds
    label: Finds
    label_singular: Find
    folder: content/finds
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: kind, label: Kind, widget: select, options: [paper, video, article, image, thought, other], default: article }
      - { name: url, label: Link, widget: string, required: false }
      - { name: image, label: Image, widget: image, required: false }
      - { name: date, label: Date found, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: draft, label: Draft (hidden on the live site), widget: boolean, default: false }
      - { name: body, label: Why it's interesting, widget: markdown, required: false, modes: [rich_text, raw], hint: "Equations: $...$ inline or $$...$$ on their own lines. Switch to Markdown mode to type them." }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site text and sections
        file: content/site.yml
        fields:
          - { name: name, label: Your name, widget: string }
          - { name: headline, label: Headline, widget: string }
          - { name: subheadline, label: Line under the headline, widget: text }
          - { name: intro, label: One-line intro, widget: text }
          - name: about
            label: About
            widget: object
            fields:
              - { name: lead, label: Opening line, widget: text }
              - { name: bio, label: Bio, widget: text, required: false }
              - { name: university, label: University, widget: string, required: false }
              - { name: degree, label: Degree, widget: string, required: false }
              - { name: years, label: Years, widget: string, required: false }
              - { name: location, label: Location, widget: string, required: false }
              - { name: portrait, label: Portrait, widget: image, required: false }
              - { name: skills, label: Skills, widget: list, required: false }
              - { name: cv, label: CV (PDF), widget: file, required: false }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: email, label: Email, widget: string }
          - name: links
            label: Links
            widget: object
            fields:
              - { name: youtube, label: YouTube channel URL, widget: string, required: false }
              - { name: github, label: GitHub, widget: string, required: false }
              - { name: linkedin, label: LinkedIn, widget: string, required: false }
          - { name: youtubeChannelId, label: YouTube channel ID, widget: string, required: false, hint: "Starts with UC. New uploads get added to Videos automatically." }
